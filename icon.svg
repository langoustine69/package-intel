<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="#1a1a2e"/>
  <g transform="translate(256,256)">
    <!-- Central package cube -->
    <polygon points="0,-100 87,-50 87,50 0,100 -87,50 -87,-50" fill="url(#grad)" opacity="0.9"/>
    <!-- Three nodes for npm, pypi, crates -->
    <circle cx="-120" cy="-70" r="30" fill="#CB3837"/>
    <circle cx="120" cy="-70" r="30" fill="#3775A9"/>
    <circle cx="0" cy="130" r="30" fill="#DEA584"/>
    <!-- Connection lines -->
    <line x1="-87" y1="-50" x2="-90" y2="-70" stroke="#fff" stroke-width="3" opacity="0.5"/>
    <line x1="87" y1="-50" x2="90" y2="-70" stroke="#fff" stroke-width="3" opacity="0.5"/>
    <line x1="0" y1="100" x2="0" y2="100" stroke="#fff" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
